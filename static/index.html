<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo · 待办事项</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- ==================== 认证区域 ==================== -->
    <div id="auth-section" class="container">
        <div class="card auth-card">
            <div class="card-header">
                <h1 class="app-title">📝 Todo 待办事项</h1>
                <p class="app-subtitle">管理你的每一天</p>
            </div>

            <!-- 标签切换 -->
            <div class="tab-switch">
                <button id="tab-login" class="tab-btn active">登录</button>
                <button id="tab-register" class="tab-btn">注册</button>
            </div>

            <!-- 登录表单 -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-username">用户名</label>
                    <input type="text" id="login-username" placeholder="请输入用户名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-password">密码</label>
                    <input type="password" id="login-password" placeholder="请输入密码" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-full">登 录</button>
                <p id="login-error" class="error-msg"></p>
            </form>

            <!-- 注册表单 -->
            <form id="register-form" class="auth-form hidden">
                <div class="form-group">
                    <label for="reg-username">用户名</label>
                    <input type="text" id="reg-username" placeholder="请设置用户名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="reg-password">密码</label>
                    <input type="password" id="reg-password" placeholder="请设置密码" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary btn-full">注 册</button>
                <p id="register-error" class="error-msg"></p>
                <p id="register-success" class="success-msg"></p>
            </form>
        </div>
    </div>

    <!-- ==================== Todo 主区域 ==================== -->
    <div id="todo-section" class="container hidden">
        <!-- 实时时钟 -->
        <div id="clock" class="clock">00:00:00</div>

        <div class="card todo-card">
            <!-- 顶部栏 -->
            <div class="todo-header">
                <div class="todo-header-left">
                    <div class="avatar-container">
                        <img id="avatar-img" class="avatar hidden" alt="头像">
                        <input type="file" id="avatar-upload" accept="image/*" hidden>
                        <label for="avatar-upload" class="avatar-upload-btn" title="上传头像">📷</label>
                    </div>
                    <div>
                        <h1 class="app-title">📝 我的待办</h1>
                        <p class="user-greeting">欢迎，<span id="current-username"></span></p>
                    </div>
                </div>
                <div class="todo-header-actions">
                    <button id="btn-theme" class="btn-icon theme-toggle" title="切换主题">🌙</button>
                    <button id="btn-logout" class="btn btn-outline">退出登录</button>
                </div>
            </div>

            <!-- 搜索 -->
            <div class="todo-search">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="搜索待办事项..." autocomplete="off">
                <button id="btn-clear-search" class="btn-icon search-clear hidden" title="清除搜索">✕</button>
            </div>

            <!-- 添加待办 -->
            <form id="todo-form" class="todo-add-form">
                <input type="text" id="todo-input" placeholder="添加新的待办事项..." required autocomplete="off">
                <select id="todo-priority" class="priority-select">
                    <option value="0">🟢 低</option>
                    <option value="1" selected>🟡 中</option>
                    <option value="2">🟠 高</option>
                    <option value="3">🔴 紧急</option>
                </select>
                <button type="submit" class="btn btn-primary">添加</button>
            </form>

            <!-- 统计信息 -->
            <div class="todo-stats">
                <span>共 <strong id="stat-total">0</strong> 项</span>
                <span>已完成 <strong id="stat-done">0</strong> 项</span>
                <button id="btn-clear-completed" class="btn btn-danger-sm hidden">清空已完成</button>
            </div>

            <!-- 待办列表 -->
            <ul id="todo-list" class="todo-list">
                <!-- 动态渲染 -->
            </ul>

            <!-- 分页 -->
            <div id="pagination" class="pagination hidden">
                <button id="btn-prev" class="btn btn-page" disabled>← 上一页</button>
                <span id="page-info" class="page-info"></span>
                <button id="btn-next" class="btn btn-page">下一页 →</button>
            </div>

            <!-- 空状态 -->
            <div id="empty-state" class="empty-state hidden">
                <div class="empty-icon">🎉</div>
                <p>暂无待办事项</p>
                <p class="empty-hint">添加你的第一个待办吧！</p>
            </div>

            <!-- 加载状态 -->
            <div id="loading-state" class="loading-state">
                <div class="spinner"></div>
                <p>加载中...</p>
            </div>

            <!-- 名人名言 -->
            <div id="quote-area" class="quote-area">
                <p id="quote-text" class="quote-text"></p>
                <p id="quote-author" class="quote-author"></p>
                <button id="btn-refresh-quote" class="btn-icon quote-refresh" title="换一条">🔄</button>
            </div>
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div id="detail-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button id="btn-close-detail" class="modal-close" title="关闭">✕</button>
            <h2 id="detail-title" class="modal-title"></h2>
            <div class="detail-grid">
                <div class="detail-item">
                    <label>优先级</label>
                    <span id="detail-priority"></span>
                </div>
                <div class="detail-item">
                    <label>创建时间</label>
                    <span id="detail-created-at"></span>
                </div>
                <div class="detail-item">
                    <label>期望完成</label>
                    <input type="datetime-local" id="detail-due-date">
                </div>
                <div class="detail-item detail-item-full">
                    <label>备注</label>
                    <textarea id="detail-notes" rows="3" placeholder="添加备注..."></textarea>
                </div>
            </div>
            <div class="detail-actions">
                <button id="btn-save-detail" class="btn btn-primary">保存</button>
                <button id="btn-cancel-detail" class="btn btn-outline">取消</button>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/clock.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/quote.js"></script>
</body>
</html>
